      <stop offset="0%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#123B66"/>
    </linearGradient>
    <linearGradient id="bbpvp-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
