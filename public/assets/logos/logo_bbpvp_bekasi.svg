    <!-- Gear / Industry Vocation Wheel -->
    <path d="M 32 18 L 35 22 L 40 20 L 41 25 L 46 26 L 44 31 L 48 34 L 44 37 L 46 42 L 41 43 L 40 48 L 35 46 L 32 50 L 29 46 L 24 48 L 23 43 L 18 42 L 20 37 L 16 34 L 20 31 L 18 26 L 23 25 L 24 20 L 29 22 Z" fill="none" stroke="url(#bbpvp-gold)" stroke-width="2.5" stroke-linejoin="round"/>
