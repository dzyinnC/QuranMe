    <circle cx="32" cy="34" r="3" fill="url(#bbpvp-gold)"/>
  </g>

  <!-- Typography -->
  <text x="86" y="28" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#0A2540" class="dark:fill-white" letter-spacing="-0.3">BBPVP BEKASI</text>
  <text x="86" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#D97706" letter-spacing="0.1">KEMENTERIAN KETENAGAKERJAAN RI</text>
  <text x="86" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B">Pelatihan Vokasi &amp; Produktivitas</text>
