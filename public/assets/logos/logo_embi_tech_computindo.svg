<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="embi-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="embi-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EAAFC"/>
    </linearGradient>
  </defs>

  <!-- Modern Tech Hexagon / Circuit Badge -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#embi-blue)" />
    <!-- Stylized 'E' Tech Circuit Nodes -->
    <path d="M 22 20 L 44 20 L 44 26 L 30 26 L 30 31 L 40 31 L 40 37 L 30 37 L 30 43 L 44 43 L 44 49 L 22 49 Z" fill="#ffffff"/>
    <circle cx="44" cy="23" r="3" fill="url(#embi-cyan)"/>
    <circle cx="40" cy="34" r="3" fill="url(#embi-cyan)"/>
    <circle cx="44" cy="46" r="3" fill="url(#embi-cyan)"/>
  </g>

  <!-- Typography -->
  <text x="86" y="30" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#0F172A" class="dark:fill-white" letter-spacing="-0.3">EMBI TECH</text>
  <text x="86" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" fill="#0284C7" letter-spacing="-0.2">COMPUTINDO</text>
  <text x="86" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B">Software &amp; IT Solutions Specialist</text>
</svg>
