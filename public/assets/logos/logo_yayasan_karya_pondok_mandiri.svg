<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="ykpm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EAAFC"/>
      <stop offset="100%" stop-color="#0877B9"/>
    </linearGradient>
    <linearGradient id="ykpm-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43B433"/>
      <stop offset="100%" stop-color="#2D8522"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Shield with Dome & Book -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#ykpm-grad)" />
    <!-- Mosque Dome Silhouette -->
    <path d="M 32 14 C 23 20 20 28 20 36 L 44 36 C 44 28 41 20 32 14 Z" fill="#ffffff" opacity="0.95" />
    <!-- Crescent & Star -->
    <path d="M 32 10 A 3 3 0 1 0 35 13 A 2.5 2.5 0 1 1 32 10 Z" fill="#FFD700" />
    <!-- Open Book / Rehal -->
    <path d="M 22 42 Q 32 38 42 42 L 42 50 Q 32 46 22 50 Z" fill="url(#ykpm-green)" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="32" y1="40" x2="32" y2="48" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Institutional Typography -->
  <text x="86" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#0F172A" class="dark:fill-white" letter-spacing="-0.3">YAYASAN KARYA</text>
  <text x="86" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#0877B9" letter-spacing="-0.3">PONDOK MANDIRI</text>
  <text x="86" y="62" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="0.2">Pendidikan &amp; Pemberdayaan Umat</text>
</svg>
